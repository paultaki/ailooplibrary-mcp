name: MCP verification
on:
  push:
    paths: ['server.py', 'test_server.py', 'pyproject.toml', 'server.json', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['server.py', 'test_server.py', 'pyproject.toml', 'server.json', '.github/workflows/mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify runtime, regressions, and ranking
        run: |
          python -m pip install -e '.[test]'
          python -m unittest -v test_server
          python server.py --self-test
          curl -fsSL https://ailooplibrary.com/catalog.json -o "$RUNNER_TEMP/catalog.json"
          AI_LOOP_LIBRARY_CATALOG_PATH="$RUNNER_TEMP/catalog.json" python server.py --eval
